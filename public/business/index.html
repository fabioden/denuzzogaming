<style>
/* ═══════════════════════════════════════════
   Denuzzo Business v2 — Professional Landing Page
   Gold + Blue accent palette
   ═══════════════════════════════════════════ */
:root {
  --gold: #d6a21a;
  --gold-light: #f0c85a;
  --blue: #4a9eff;
  --blue-dim: rgba(74,158,255,0.12);
  --blue-glow: rgba(74,158,255,0.08);
  --dark: #0e0c0d;
  --dark-card: #16141a;
  --dark-card-2: #1a181e;
  --ink-0: #f0ece4;
  --ink-1: #b8b2a6;
  --ink-2: #706c64;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-sans: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-font-smoothing:antialiased; }
body { background:#0d0b0c; color:var(--ink-0); font-family:var(--font-sans); overflow-x:hidden; }
a, button { cursor:pointer; }

/* ── Mesh Gradient Background (Apple-style) ── */
.ai-mesh-bg {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  overflow:hidden;
}
.ai-mesh-blob {
  position:absolute; border-radius:50%; filter:blur(100px); opacity:0.35;
  will-change:transform;
}
.ai-mesh-blob--gold {
  width:70vw; height:70vw; max-width:1100px; max-height:1100px;
  background:radial-gradient(circle, rgba(214,162,26,0.8) 0%, rgba(214,162,26,0.3) 35%, transparent 65%);
  animation:meshDrift1 20s ease-in-out infinite;
}
.ai-mesh-blob--blue {
  width:65vw; height:65vw; max-width:1000px; max-height:1000px;
  background:radial-gradient(circle, rgba(74,158,255,0.7) 0%, rgba(74,158,255,0.25) 35%, transparent 65%);
  animation:meshDrift2 25s ease-in-out infinite;
}
.ai-mesh-blob--purple {
  width:60vw; height:60vw; max-width:900px; max-height:900px;
  background:radial-gradient(circle, rgba(124,92,191,0.6) 0%, rgba(124,92,191,0.2) 35%, transparent 65%);
  animation:meshDrift3 22s ease-in-out infinite;
}
@keyframes meshDrift1 {
  0%{transform:translate(-10%,10%)} 33%{transform:translate(20%,60%)} 66%{transform:translate(50%,20%)} 100%{transform:translate(-10%,10%)}
}
@keyframes meshDrift2 {
  0%{transform:translate(80%,20%)} 33%{transform:translate(30%,70%)} 66%{transform:translate(60%,10%)} 100%{transform:translate(80%,20%)}
}
@keyframes meshDrift3 {
  0%{transform:translate(40%,80%)} 33%{transform:translate(10%,30%)} 66%{transform:translate(70%,50%)} 100%{transform:translate(40%,80%)}
}

/* ── Progress Bar ── */
.ai-progress-bar {
  position:fixed; top:0; left:0; z-index:90;
  width:3px; height:100vh; pointer-events:none;
}
.ai-progress-track {
  position:absolute; inset:0;
  background:rgba(240,236,228,0.03);
}
.ai-progress-fill {
  position:absolute; top:0; left:0; width:100%;
  background:linear-gradient(to bottom, var(--gold), var(--blue));
  transition:height 0.15s ease-out;
  box-shadow:0 0 8px rgba(214,162,26,0.3);
}
.ai-progress-dot {
  position:absolute; left:50%; width:8px; height:8px;
  border-radius:50%; background:var(--gold);
  transform:translateX(-50%); transition:top 0.15s ease-out;
  box-shadow:0 0 12px rgba(214,162,26,0.4);
}

/* ── Hero Particles ── */
.ai-hero-particles { position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
.ai-hero-particle {
  position:absolute; border-radius:50%; background:var(--gold); opacity:0;
  animation:heroParticle linear infinite;
}
@keyframes heroParticle {
  0%{opacity:0;transform:translateY(0) scale(0.5)} 15%{opacity:0.6} 85%{opacity:0.3} 100%{opacity:0;transform:translateY(-100vh) scale(0.2)}
}

/* ── Custom Cursor ── */
.ai-cursor {
  position:fixed; top:0; left:0; z-index:200000; pointer-events:none;
  width:10px; height:10px; border-radius:50%;
  background:var(--gold); mix-blend-mode:difference;
  transition: width 0.2s, height 0.2s, margin 0.2s;
}
.ai-cursor-ring {
  position:fixed; top:0; left:0; z-index:199999; pointer-events:none;
  width:36px; height:36px; border-radius:50%;
  border:1px solid rgba(214,162,26,0.3);
  transition: width 0.3s, height 0.3s, margin 0.3s, border-color 0.3s;
}
.ai-cursor.hover { width:18px; height:18px; margin:-4px 0 0 -4px; }
.ai-cursor-ring.hover { width:50px; height:50px; margin:-7px 0 0 -7px; border-color:var(--blue); }
@media(max-width:768px){ .ai-cursor,.ai-cursor-ring{display:none} body{cursor:auto} a,button{cursor:pointer} }

/* ── Grain ── */
.ai-grain {
  position:fixed; inset:0; z-index:50; pointer-events:none; opacity:0.025;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat:repeat; background-size:256px;
}

/* ── Grid Lines ── */
.ai-gridlines { position:fixed; inset:0; z-index:1; pointer-events:none; }
.ai-gridlines span {
  position:absolute; top:0; bottom:0; width:1px;
  background:rgba(240,236,228,0.025);
}

/* ── Hero ── */
.ai-hero {
  position:relative; width:100%; height:100vh; min-height:650px;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.ai-hero-bg {
  position:absolute; inset:-40px; z-index:0;
  background:url('img/ai-hero-bg.png') center/cover no-repeat;
  filter:brightness(0.3) saturate(0.8);
  will-change:transform;
}
.ai-hero-overlay {
  position:absolute; inset:0; z-index:1;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(74,158,255,0.04) 0%, transparent 60%),
    linear-gradient(to bottom, rgba(8,8,10,0.2) 0%, rgba(8,8,10,0.05) 40%, rgba(8,8,10,0.75) 100%);
}
.ai-hero-content {
  position:relative; z-index:2; text-align:center; max-width:900px; padding:2rem;
}
.ai-hero-eyebrow {
  display:inline-flex; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:11px; font-weight:500;
  letter-spacing:0.25em; text-transform:uppercase; color:var(--blue);
  margin-bottom:1.5rem; opacity:0; transform:translateY(20px);
}
.ai-hero-eyebrow .dot { width:6px; height:6px; border-radius:50%; background:var(--blue); animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
.ai-hero-title {
  font-family:var(--font-display); font-weight:400;
  font-size:clamp(3rem,8vw,6rem); line-height:1.05;
  color:var(--ink-0); letter-spacing:-0.025em;
  margin-bottom:1.5rem; opacity:0; transform:translateY(30px);
}
.ai-hero-title em { color:var(--gold); font-style:italic; }
.ai-hero-sub {
  font-family:var(--font-sans); font-size:clamp(1rem,1.4vw,1.15rem);
  color:var(--ink-1); line-height:1.6; max-width:48ch; margin:0 auto 2.5rem;
  opacity:0; transform:translateY(20px);
}
.ai-hero-cta {
  display:inline-flex; align-items:center; gap:10px;
  padding:16px 40px; background:transparent; color:var(--ink-0);
  font-family:var(--font-mono); font-size:12px; font-weight:600;
  letter-spacing:0.16em; text-transform:uppercase; text-decoration:none;
  border:1px solid rgba(214,162,26,0.35); cursor:pointer;
  transition:all 0.4s ease, box-shadow 0.4s ease;
  position:relative; overflow:hidden; opacity:0; transform:translateY(20px);
}
.ai-hero-cta:hover { color:var(--dark); border-color:var(--gold); box-shadow:0 0 30px rgba(214,162,26,0.15), 0 0 60px rgba(74,158,255,0.08); }
.ai-hero-cta::before {
  content:''; position:absolute; inset:0;
  background:var(--gold); transform:scaleX(0); transform-origin:left;
  transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);
}
.ai-hero-cta:hover::before { transform:scaleX(1); }
.ai-hero-cta span, .ai-hero-cta svg { position:relative; z-index:1; }

.ai-hero-scroll {
  position:absolute; bottom:2.5rem; left:50%; transform:translateX(-50%); z-index:2;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  color:var(--ink-2); font-family:var(--font-mono); font-size:9px;
  letter-spacing:0.3em; text-transform:uppercase;
  animation:heroFloat 3s ease-in-out infinite;
}
.ai-hero-scroll .scroll-line { width:1px; height:40px; background:linear-gradient(to bottom,var(--gold),transparent); }
@keyframes heroFloat { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-6px)} }

.ai-hero-contact {
  position:absolute; bottom:2.5rem; left:3rem; z-index:2;
  font-family:var(--font-mono); font-size:10px; line-height:2;
}
.ai-hero-contact span { color:var(--ink-2); display:block; letter-spacing:0.1em; text-transform:uppercase; }
.ai-hero-contact a { color:var(--gold); text-decoration:none; letter-spacing:0.02em; }
.ai-hero-contact a:hover { text-decoration:underline; }

.ai-hero-socials {
  position:absolute; bottom:2.5rem; right:3rem; z-index:2; display:flex; gap:18px;
}
.ai-hero-socials a { color:var(--ink-2); transition:all 0.3s; text-decoration:none; }
.ai-hero-socials a:hover { color:var(--blue); transform:translateY(-2px); }

/* ── Hamburger Nav ── */
.ai-nav { position:fixed; top:0; right:0; z-index:100; padding:1.5rem 2rem; }
.ai-hamburger {
  width:48px; height:48px; background:rgba(8,8,10,0.5);
  backdrop-filter:blur(16px); border:1px solid rgba(240,236,228,0.06);
  border-radius:50%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:5px;
  cursor:pointer; transition:all 0.4s ease; padding:0;
}
.ai-hamburger:hover { border-color:rgba(214,162,26,0.25); background:rgba(8,8,10,0.7); }
.ai-ham-line {
  width:18px; height:1.5px; background:var(--ink-0);
  border-radius:1px; transition:all 0.4s cubic-bezier(0.16,1,0.3,1); transform-origin:center;
}

.ai-fullmenu {
  position:fixed; inset:0; z-index:99;
  background:rgba(8,8,10,0.97); backdrop-filter:blur(40px);
  display:flex; align-items:center; justify-content:center;
  opacity:0; visibility:hidden; transition:all 0.5s cubic-bezier(0.16,1,0.3,1);
}
.ai-fullmenu.is-open { opacity:1; visibility:visible; }
.ai-fullmenu-inner { text-align:center; }
.ai-fullmenu-link {
  display:block; font-family:var(--font-display); font-size:clamp(2rem,5vw,3.5rem);
  font-weight:400; color:var(--ink-2); text-decoration:none;
  padding:0.35em 0; transition:all 0.4s ease; letter-spacing:-0.01em;
}
.ai-fullmenu-link:hover { color:var(--gold); transform:translateX(12px); letter-spacing:0.02em; }
.ai-fullmenu-divider { width:50px; height:1px; background:rgba(74,158,255,0.15); margin:1.8rem auto; }
.ai-fullmenu-small {
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:11px;
  color:var(--ink-2); text-decoration:none; padding:0.4em 0;
  letter-spacing:0.12em; text-transform:uppercase; transition:color 0.3s;
}
.ai-fullmenu-small:hover { color:var(--blue); }

/* ── Sections ── */
.ai-section { padding:clamp(7rem,16vh,14rem) clamp(1.5rem,5vw,8rem); position:relative; z-index:2; }
.ai-section-meta {
  display:flex; align-items:center; gap:12px;
  font-family:var(--font-mono); font-size:10px; font-weight:500;
  letter-spacing:0.25em; text-transform:uppercase; color:var(--blue);
  margin-bottom:1rem;
}
.ai-section-meta .ai-num { color:var(--gold); opacity:0.6; }
.ai-section-meta .ai-bar { width:32px; height:1px; background:linear-gradient(90deg,var(--gold),var(--blue)); opacity:0.3; }
.ai-section-title {
  font-family:var(--font-display); font-weight:400;
  font-size:clamp(2.6rem,5.5vw,4.2rem); line-height:1.08;
  max-width:18ch; margin-bottom:1.8rem; color:var(--ink-0);
  letter-spacing:-0.02em;
}
.ai-section-title em { color:var(--gold); font-style:italic; }
.ai-section-title .blue { color:var(--blue); }
.ai-section-text {
  font-size:clamp(1rem,1.2vw,1.1rem); line-height:1.75;
  color:var(--ink-1); max-width:58ch;
}
.ai-separator {
  width:60px; height:1px;
  background:linear-gradient(90deg, var(--gold), var(--blue));
  margin:0 0 2rem 0; opacity:0.4;
}

/* ── Stats Bar ── */
.ai-stats {
  display:flex; justify-content:center; gap:clamp(2rem,6vw,5rem);
  padding:clamp(4rem,8vh,7rem) 2rem;
  border-top:1px solid rgba(214,162,26,0.04);
  border-bottom:1px solid rgba(74,158,255,0.04);
  flex-wrap:wrap; position:relative; z-index:2;
}
.ai-stat { text-align:center; }
.ai-stat-value {
  font-family:var(--font-display); font-size:clamp(2.5rem,5vw,3.5rem);
  font-weight:400; color:var(--ink-0); line-height:1;
}
.ai-stat-value .gold { color:var(--gold); }
.ai-stat-label {
  font-family:var(--font-mono); font-size:10px; font-weight:500;
  letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-2);
  margin-top:0.6rem;
}

/* ── Services Flip Cards ── */
.ai-services-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:1.5rem; margin-top:3rem;
}
.ai-flip-card { perspective:1000px; height:320px; cursor:pointer; }
.ai-flip-inner {
  position:relative; width:100%; height:100%;
  transition:transform 0.7s cubic-bezier(0.16,1,0.3,1);
  transform-style:preserve-3d;
}
.ai-flip-card:hover .ai-flip-inner { transform:rotateY(180deg); }
.ai-flip-front, .ai-flip-back {
  position:absolute; inset:0; backface-visibility:hidden;
  border-radius:14px; padding:2rem;
  border:1px solid rgba(240,236,228,0.04);
  display:flex; flex-direction:column;
}
.ai-flip-front {
  background:rgba(14,14,17,0.6);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  justify-content:space-between;
}
.ai-flip-front::after {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, var(--gold), var(--blue));
  opacity:0; transition:opacity 0.3s; border-radius:14px 14px 0 0;
}
.ai-flip-card:hover .ai-flip-front::after { opacity:1; }
.ai-flip-back {
  background:rgba(19,19,22,0.7);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  transform:rotateY(180deg); justify-content:center;
  border-color:rgba(74,158,255,0.08);
}
.ai-flip-icon {
  width:52px; height:52px; border-radius:12px;
  background:linear-gradient(135deg, rgba(214,162,26,0.08), rgba(74,158,255,0.06));
  display:flex; align-items:center; justify-content:center; font-size:24px;
  margin-bottom:1.5rem;
}
.ai-flip-name {
  font-family:var(--font-sans); font-size:1.15rem; font-weight:600;
  color:var(--ink-0); margin-bottom:0.5rem;
}
.ai-flip-desc { font-size:0.9rem; line-height:1.6; color:var(--ink-2); }
.ai-flip-hint {
  margin-top:auto; font-family:var(--font-mono); font-size:10px;
  letter-spacing:0.15em; text-transform:uppercase; color:var(--blue);
  opacity:0.6; display:flex; align-items:center; gap:6px;
}
.ai-flip-back-title {
  font-family:var(--font-mono); font-size:10px; font-weight:600;
  letter-spacing:0.2em; text-transform:uppercase; color:var(--gold);
  margin-bottom:1.2rem;
}
.ai-flip-back-list { list-style:none; display:flex; flex-direction:column; gap:10px; }
.ai-flip-back-list li {
  display:flex; align-items:flex-start; gap:10px;
  font-size:0.9rem; line-height:1.5; color:var(--ink-1);
}
.ai-flip-back-list li::before {
  content:'→'; color:var(--blue); flex-shrink:0; margin-top:1px;
}

/* ── Portfolio Carousel ── */
.ai-carousel-section { padding:clamp(7rem,16vh,14rem) 0; position:relative; overflow:hidden; z-index:2; }
.ai-carousel-header { padding:0 clamp(1.5rem,5vw,8rem); margin-bottom:3rem; }
.ai-carousel {
  display:flex; gap:1.5rem; padding:0 clamp(1.5rem,5vw,8rem);
  overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; cursor:grab;
}
.ai-carousel::-webkit-scrollbar { display:none; }
.ai-carousel:active { cursor:grabbing; }
.ai-carousel-card {
  flex-shrink:0; width:clamp(300px,40vw,450px); scroll-snap-align:start;
  border-radius:14px; overflow:hidden; position:relative;
  aspect-ratio:4/3;
  background:rgba(14,14,17,0.5); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(240,236,228,0.05);
  transition:all 0.4s ease;
}
.ai-carousel-card:hover { border-color:rgba(214,162,26,0.15); transform:translateY(-6px); }
.ai-carousel-placeholder {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:8px;
  background:linear-gradient(135deg, rgba(214,162,26,0.02), rgba(74,158,255,0.04));
  font-family:var(--font-mono); font-size:11px; color:var(--ink-2);
  letter-spacing:0.12em; text-transform:uppercase;
}
.ai-carousel-placeholder .ph-icon { font-size:28px; opacity:0.3; margin-bottom:4px; }
.ai-carousel-label {
  position:absolute; bottom:0; left:0; right:0;
  padding:1.5rem; background:linear-gradient(to top, rgba(8,8,10,0.95) 0%, transparent 100%);
}
.ai-carousel-label span {
  font-family:var(--font-mono); font-size:10px; color:var(--blue);
  letter-spacing:0.12em; text-transform:uppercase; display:block; margin-bottom:4px;
}
.ai-carousel-label h3 {
  font-family:var(--font-sans); font-size:1rem; font-weight:600; color:var(--ink-0);
}
.ai-carousel-dots {
  display:flex; justify-content:center; gap:8px; margin-top:2rem;
  padding:0 clamp(1.5rem,5vw,8rem);
}
.ai-carousel-dot {
  width:32px; height:3px; border-radius:2px;
  background:rgba(240,236,228,0.08); transition:all 0.3s;
  border:none; padding:0; cursor:pointer;
}
.ai-carousel-dot.active { background:var(--gold); width:48px; }

/* ── Testimonials ── */
.ai-testimonials { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1.5rem; margin-top:3rem; }
.ai-testimonial {
  background:rgba(14,14,17,0.5); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(240,236,228,0.05);
  border-radius:14px; padding:2.2rem; position:relative;
  transition:all 0.4s ease;
}
.ai-testimonial:hover { border-color:rgba(74,158,255,0.1); transform:translateY(-4px); }
.ai-testimonial-quote {
  position:absolute; top:1.2rem; right:1.5rem;
  font-family:var(--font-display); font-size:3rem;
  color:rgba(74,158,255,0.06); line-height:1;
}
.ai-testimonial-text {
  font-size:0.95rem; line-height:1.75; color:var(--ink-1);
  font-style:italic; margin-bottom:1.5rem; position:relative; z-index:1;
}
.ai-testimonial-footer { display:flex; align-items:center; gap:12px; }
.ai-testimonial-avatar {

// ── Language Picker Overlay (AnimatedContent-style GSAP) ──
function AILangPicker({ onChoose, onDone }) {
  const titleRef = React.useRef(null);
  const btnsRef = React.useRef(null);
  const [chosen, setChosen] = React.useState(false);

  React.useEffect(() => {
    const titleEl = titleRef.current;
    const btnsEl = btnsRef.current;
    if (titleEl) {
      gsap.set(titleEl, { y: 60, scale: 0.9, opacity: 0, visibility: 'visible' });
      gsap.to(titleEl, { y: 0, scale: 1, opacity: 1, duration: 1.8, ease: 'power3.out', delay: 0.5 });
    }
    if (btnsEl) {
      gsap.set(btnsEl, { y: 40, opacity: 0, visibility: 'visible' });
      gsap.to(btnsEl, { y: 0, opacity: 1, duration: 1.4, ease: 'power3.out', delay: 1.2 });
    }
  }, []);

  const handleChoice = (lang) => {
    if (chosen) return;
    setChosen(true);
    onChoose(lang); // mount Preloader behind immediately
    const overlay = titleRef.current?.closest('.ai-lang-picker-overlay');
    if (overlay) {
      gsap.to(overlay, {
        opacity: 0, duration: 1.2, ease: 'power2.inOut',
        onComplete: () => { if (onDone) onDone(); }
      });
    } else {
      setTimeout(() => { if (onDone) onDone(); }, 1000);
    }
  };

  return (
    <div className="ai-lang-picker-overlay">
      <div ref={titleRef} style={{ visibility: 'hidden' }}>
        <div className="ai-lang-picker-title">
          Scegli la lingua<br/>
          <span style={{ opacity: 0.5, fontSize: '0.85em' }}>Choose your language</span>
        </div>
      </div>
      <div ref={btnsRef} className="ai-lang-picker-buttons" style={{ visibility: 'hidden' }}>
        <button className="ai-lang-picker-btn" onClick={() => handleChoice('it')}>ITA</button>
        <button className="ai-lang-picker-btn" onClick={() => handleChoice('en')}>ENG</button>
      </div>
    </div>
  );
}

function Preloader({ onComplete }) {
  const [progress, setProgress] = React.useState(0);
  const [phase, setPhase] = React.useState('loading'); // loading → fadeout → done

  React.useEffect(() => {
    let p = 0;
    const tick = setInterval(() => {
      p += 2 + Math.random() * 5;
      if (p >= 100) { p = 100; clearInterval(tick); setTimeout(() => setPhase('fadeout'), 400); }
      setProgress(Math.min(p, 100));
    }, 60);
    return () => clearInterval(tick);
  }, []);

  React.useEffect(() => {
    if (phase === 'fadeout') setTimeout(() => { setPhase('done'); onComplete && onComplete(); }, 900);
  }, [phase]);

  if (phase === 'done') return null;

  return (
    <div className={'preloader' + (phase === 'fadeout' ? ' preloader--out' : '')}>
      <div className="preloader-inner">
        <div className="preloader-logo"><img src="img/fd-logo.png" alt="Denuzzo Business" style={{width:'600px',height:'auto',objectFit:'contain'}} /></div>
        <div className="preloader-bar">
          <div className="preloader-fill" style={{width: progress + '%'}}></div>
        </div>
        <div className="preloader-pct">{Math.round(progress)}%</div>
      </div>
    </div>
  );
}

// ── 2. Text Reveal (clip mask horizontal) ──
function TextReveal({ children, delay = 0, as = 'div' }) {
  const ref = React.useRef(null);
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const ob = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold: 0.15 });
    if (ref.current) ob.observe(ref.current);
    return () => ob.disconnect();
  }, []);
  const Tag = as;
  return (
    <Tag ref={ref} className={'text-reveal' + (visible ? ' is-revealed' : '')} style={{'--tr-delay': delay + 's'}}>
      <span className="text-reveal-inner">{children}</span>
    </Tag>
  );
}

// ── 3. Magnetic Button ──
function MagneticButton({ children, className = '', href, onClick, style, as = 'a' }) {
  const ref = React.useRef(null);
  const handleMove = (e) => {
    const el = ref.current; if (!el) return;
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = (e.clientX - cx) * 0.25;
    const dy = (e.clientY - cy) * 0.25;
    el.style.transform = `translate(${dx}px, ${dy}px)`;
  };
  const handleLeave = () => {
    const el = ref.current; if (!el) return;
    el.style.transform = 'translate(0,0)';
    el.style.transition = 'transform 0.4s cubic-bezier(0.16,1,0.3,1)';
    setTimeout(() => { if (el) el.style.transition = ''; }, 400);
  };
  const Tag = as;
  const props = { ref, className: 'magnetic ' + className, onMouseMove: handleMove, onMouseLeave: handleLeave, style };
  if (Tag === 'a') { props.href = href; props.onClick = onClick; }
  else { props.onClick = onClick; props.type = 'button'; }
  return <Tag {...props}>{children}</Tag>;
}

// ── 4. Marquee ──
function Marquee({ items, speed = 30 }) {
  const doubled = [...items, ...items];
  return (
    <div className="marquee-wrap">
      <div className="marquee-track" style={{animationDuration: speed + 's'}}>
        {doubled.map((item, i) => (
          <span key={i} className="marquee-item">
            {item}
            <span className="marquee-dot">·</span>
          </span>
        ))}
      </div>
    </div>
  );
}

  const handleMove = (e) => {

    const y = ((e.clientY - rect.top) / rect.height - 0.5) * -8;
    el.style.transform = `perspective(800px) rotateY(${x}deg) rotateX(${y}deg) translateY(-6px)`;
  };
  const handleLeave = () => {
    setHover(false);
    const el = ref.current; if (!el) return;
    el.style.transform = 'perspective(800px) rotateY(0) rotateX(0) translateY(0)';
  };
  return (
    <div ref={ref} className="port-card" onMouseEnter={() => setHover(true)} onMouseMove={handleMove} onMouseLeave={handleLeave}>

// ── Hero Particles ──
function HeroParticles() {
  const particles = React.useMemo(() => {

          animationDelay: p.delay + 's'
        }}></div>
      ))}
    </div>

// ── Scroll Progress Bar ──
function ScrollProgressBar() {
  const [progress, setProgress] = React.useState(0);
  React.useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setProgress(h > 0 ? (window.scrollY / h) * 100 : 0);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <div className="ai-progress-bar">
      <div className="ai-progress-track"></div>
      <div className="ai-progress-fill" style={{height: progress + '%'}}></div>
      <div className="ai-progress-dot" style={{top: progress + '%'}}></div>
    </div>
  );
}

// ── Custom Cursor ──
function AICursor() {
  const dotRef = React.useRef(null);
  const ringRef = React.useRef(null);
  React.useEffect(() => {
    let mx = 0, my = 0, dx = 0, dy = 0;
    const move = (e) => { mx = e.clientX; my = e.clientY; };
    const tick = () => {
      dx += (mx - dx) * 0.15; dy += (my - dy) * 0.15;
      if (dotRef.current) { dotRef.current.style.transform = `translate(${mx - 5}px,${my - 5}px)`; }
      if (ringRef.current) { ringRef.current.style.transform = `translate(${dx - 18}px,${dy - 18}px)`; }
      requestAnimationFrame(tick);
    };
    const addHover = () => { dotRef.current?.classList.add('hover'); ringRef.current?.classList.add('hover'); };
    const removeHover = () => { dotRef.current?.classList.remove('hover'); ringRef.current?.classList.remove('hover'); };
    document.addEventListener('mousemove', move);
    requestAnimationFrame(tick);
    const links = document.querySelectorAll('a,button,.ai-faq-q,.ai-carousel-card,.ai-flip-card');
    links.forEach(l => { l.addEventListener('mouseenter', addHover); l.addEventListener('mouseleave', removeHover); });
    return () => { document.removeEventListener('mousemove', move); };
  }, []);
  return (<React.Fragment><div className="ai-cursor" ref={dotRef}></div><div className="ai-cursor-ring" ref={ringRef}></div></React.Fragment>);
}

// ── Animated Counter ──
function AnimCounter({ target, suffix = '', duration = 2000 }) {
  const ref = React.useRef(null);
  const [val, setVal] = React.useState(0);
  const [started, setStarted] = React.useState(false);
  React.useEffect(() => {
    const ob = new IntersectionObserver(([e]) => { if (e.isIntersecting && !started) { setStarted(true); } }, { threshold: 0.3 });
    if (ref.current) ob.observe(ref.current);
    return () => ob.disconnect();
  }, [started]);
  React.useEffect(() => {
    if (!started) return;
    const num = parseInt(target);
    const steps = 60;
    const inc = num / steps;
    let current = 0;
    const interval = setInterval(() => {
      current += inc;
      if (current >= num) { setVal(num); clearInterval(interval); }
      else { setVal(Math.floor(current)); }
    }, duration / steps);
    return () => clearInterval(interval);
  }, [started, target, duration]);
  return <span ref={ref}>{val}{suffix}</span>;
}

          <h2>{t('cta.title_start', lang)}<em>{t('cta.title_em', lang)}</em>?</h2>
          <MagneticButton href="#contatti" className="ai-hero-cta" onClick={(e)=>{e.preventDefault();scrollTo('contatti')}} style={{opacity:1,transform:'none'}}>
            <span>{t('cta.btn', lang)}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </MagneticButton>
        </div>
      </div>

      {/* ═══ TESTIMONIANZE — rimosso temporaneamente ═══ */}

      {/* ═══ FAQ ═══ */}
      <section className="ai-section" id="faq" style={{background:'rgba(74,158,255,0.01)'}}>
        <div ref={addReveal} className="ai-reveal">
          <div className="ai-section-meta"><span className="ai-num">04</span><span className="ai-bar"></span><span>{t('faq.meta', lang)}</span></div>
          <div className="ai-separator"></div>
          <h2 className="ai-section-title">{t('faq.title_start', lang)}<em>{t('faq.title_em', lang)}</em>.</h2>
        </div>
        <div className="ai-faq-list" ref={addReveal}>
          <FAQItem q={t('faq.q1', lang)} a={t('faq.a1', lang)} />
          <FAQItem q={t('faq.q2', lang)} a={t('faq.a2', lang)} />
          <FAQItem q={t('faq.q3', lang)} a={t('faq.a3', lang)} />
        </div>
      </section>

      {/* ═══ DENUZZO GAMING ═══ */}
      <section className="ai-section" id="gaming" style={{textAlign:'center'}}>
        <div ref={addReveal} className="ai-reveal">
          <div className="ai-section-meta" style={{justifyContent:'center'}}><span className="ai-num">05</span><span className="ai-bar"></span><span>{t('gaming.meta', lang)}</span></div>
          <div className="ai-separator" style={{margin:'0 auto 2rem'}}></div>
          <h2 className="ai-section-title" style={{maxWidth:'22ch',margin:'0 auto 1.5rem'}}>{t('gaming.title_start', lang)}<em>{t('gaming.title_em', lang)}</em>.</h2>
          <p className="ai-section-text" style={{maxWidth:'52ch',margin:'0 auto'}}>
            {t('gaming.text', lang)}
          </p>
          <div style={{marginTop:'2.5rem'}}>
            <MagneticButton href="/" className="ai-hero-cta" style={{opacity:1,transform:'none'}}>
              <span>{t('gaming.cta', lang)}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </MagneticButton>
          </div>
        </div>
      </section>

      {/* ═══ CONTATTI ═══ */}
      <section className="ai-section" id="contatti">
        <div ref={addReveal} className="ai-reveal">
          <div className="ai-section-meta"><span className="ai-num">06</span><span className="ai-bar"></span><span>{t('contact.meta', lang)}</span></div>
          <div className="ai-separator"></div>
          <h2 className="ai-section-title">{t('contact.title_start', lang)}<em>{t('contact.title_em', lang)}</em>?</h2>
        </div>
        <div className="ai-contact-wrap">
          <div className="ai-contact-info">
            <div ref={addReveal} className="ai-reveal ai-contact-item">
              <div className="ai-contact-label">{t('contact.email_label', lang)}</div>
              <div className="ai-contact-value"><a href="mailto:business.fabiodenuzzo@gmail.com">business.fabiodenuzzo@gmail.com</a></div>
            </div>
            <div ref={addReveal} className="ai-reveal ai-contact-item" style={{transitionDelay:'0.1s'}}>
              <div className="ai-contact-label">{t('contact.services_label', lang)}</div>
              <div className="ai-contact-value">{t('contact.services_value', lang)}</div>
            </div>
            <div ref={addReveal} className="ai-reveal ai-contact-item" style={{transitionDelay:'0.2s'}}>
              <div className="ai-contact-label">{t('contact.availability_label', lang)}</div>
              <div className="ai-contact-value" style={{color:'var(--blue)'}}>{t('contact.availability_value', lang)}</div>
            </div>
          </div>
          <div className="ai-contact-form">
            <form ref={addReveal} className="ai-reveal" style={{transitionDelay:'0.15s'}} onSubmit={(e) => e.preventDefault()}>
              <input className="ai-input" type="text" placeholder={t('contact.input_name', lang)} />
              <input className="ai-input" type="email" placeholder={t('contact.input_email', lang)} />
              <textarea className="ai-input" placeholder={t('contact.input_message', lang)}></textarea>
              <button type="submit" className="ai-submit">
                <span>{t('contact.submit', lang)}</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </form>
          </div>
        </div>
      </section>

      {/* ═══ FOOTER PREMIUM ═══ */}
      <PremiumFooter />
    </React.Fragment>
    )}
    </React.Fragment>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DenuzzoAI />);

</script>
