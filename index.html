    <!-- SEO per-pagina (title, description, canonical, OG, hreflang) gestita da react-helmet
         (componente Seo). NON rimettere meta SEO statici qui: helmet NON li sostituisce → si duplicano. -->

    <!-- Cloudflare Web Analytics (gratis, niente cookie · token pubblico del beacon) -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "b4023fc08f7342909443084634ba6bbf"}'></script>


    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Body (Satoshi) via Fontshare; Clash Display tenuto come fallback display -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet" />
    <!-- NB: i font del mondo diabete (Fraunces/Hanken/Space Mono) sono stati rimossi:
         /diabete è gated. Vanno ri-aggiunti (idealmente solo su /diabete) alla Fase 3. -->
